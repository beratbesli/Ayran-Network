# Ayran-Network Configuration File
# Copy to ~/.config/ayran-network/config.toml or ~/.ayran-network/config.toml

[general]
# Polling interval in seconds (default: 1.0)
poll_interval = 1.0

# Number of historical points to store for rate history and sparklines (default: 60)
history_size = 60

[focus]
# Applications to highlight in the Focused Applications section
apps = ["BeamNG.drive", "Elden Ring", "Fortnite", "steam", "discord", "firefox", "chrome"]

# Set to false to replace default app list instead of extending it (default: true)
extend_defaults = true

[geoip]
# Opt-in: public IP addresses may be sent to an HTTPS third-party service (default: false)
enabled = false
# endpoint = "https://ipwho.is/{encoded_ip}"

[interface]
# Interface filtering:
#   ""                         - Monitor all active network interfaces
#   "no-virtual"               - Exclude docker, veth, lo, tun, tap, virbr, etc.
#   "exclude:docker,veth,virbr"- Exclude matching interface names (comma-separated regex)
#   "include:eth0,wlan0"       - Include only matching interface names
filter = ""

[export]
# Export snapshots output directory (default: ~/.ayran-network/exports)
# directory = "~/.ayran-network/exports"
