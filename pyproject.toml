[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ayran-network"
version = "0.1.0"
description = "A responsive terminal dashboard for real-time Linux network traffic monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayran-Network contributors" }]
dependencies = [
    "httpx>=0.27.0",
    "psutil>=5.9.8",
    "textual>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
ayranetwork = "ayran_network.app:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "types-psutil>=5.9.5.20240516",
]

[tool.hatch.build.targets.wheel]
packages = ["ayran_network"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true
